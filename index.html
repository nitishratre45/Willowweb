<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CricZone Live Player (Hybrid M3U + JSON)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>

    <style>
        :root {
            --primary: #00ff87;
            --bg: #080c14;
            --card-bg: rgba(22, 30, 46, 0.9);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            height: 60px;
            background: rgba(8, 12, 20, 0.95);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 20px; font-weight: bold; color: var(--primary); display: flex; align-items: center; gap: 8px; }

        .container {
            width: 100%;
            max-width: 1100px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        video, iframe { width: 100%; height: 100%; border: none; background: #000; }

        .player-info {
            background: var(--card-bg);
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .active-title { font-size: 16px; font-weight: bold; color: var(--primary); }

        .search-box { position: relative; width: 100%; }
        .search-box input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #aaa; }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .channel-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 75px;
        }

        .channel-card:hover, .channel-card.active {
            border-color: var(--primary);
            background: rgba(0, 255, 135, 0.15);
            color: var(--primary);
        }

        .status-msg { text-align: center; color: var(--primary); font-size: 14px; padding: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-play"></i> CricZone Live Player</div>
    </header>

    <div class="container">
        <div class="player-wrapper">
            <video id="videoPlayer" controls autoplay playsinline style="display: none;"></video>
            <iframe id="iframePlayer" allowfullscreen allow="autoplay" style="display: none;"></iframe>
        </div>

        <div class="player-info">
            <span class="active-title" id="currentChannelName">Loading Channels...</span>
            <button onclick="reloadCurrentStream()" style="background:transparent; border:none; color:#fff; cursor:pointer;">
                <i class="fa-solid fa-rotate-right"></i> Reload
            </button>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Channel Khojein..." onkeyup="filterChannels()">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <div class="channels-grid" id="channelsList">
            <div class="status-msg"><i class="fa-solid fa-spinner fa-spin"></i> Loading Channels...</div>
        </div>
    </div>

    <script>
        const JSON_URL = "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/live_sports.json";
        const M3U_URL = "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/live_sports.m3u";
        const PROXY = "https://corsproxy.io/?";

        let allChannels = [];
        let shakaPlayer = null;
        let currentChannel = null;

        const videoPlayer = document.getElementById('videoPlayer');
        const iframePlayer = document.getElementById('iframePlayer');
        const channelNameLabel = document.getElementById('currentChannelName');
        const channelsGrid = document.getElementById('channelsList');

        async function initShaka() {
            shaka.polyfill.installAll();
            if (shaka.Player.isBrowserSupported()) {
                shakaPlayer = new shaka.Player(videoPlayer);
            }
        }

        async function loadData() {
            // Attempt 1: Fetch JSON Direct
            try {
                let res = await fetch(JSON_URL);
                if (!res.ok) throw new Error("JSON Direct Failed");
                allChannels = await res.json();
                if(allChannels.length > 0) return finalizeLoad();
            } catch(e) { console.log("JSON Direct Failed, trying Proxy..."); }

            // Attempt 2: Fetch JSON via Proxy
            try {
                let res = await fetch(PROXY + encodeURIComponent(JSON_URL));
                if (!res.ok) throw new Error("JSON Proxy Failed");
                allChannels = await res.json();
                if(allChannels.length > 0) return finalizeLoad();
            } catch(e) { console.log("JSON Proxy Failed, trying M3U..."); }

            // Attempt 3: Fetch M3U as Fallback
            try {
                let res = await fetch(PROXY + encodeURIComponent(M3U_URL));
                let m3uText = await res.text();
                allChannels = parseM3U(m3uText);
                if(allChannels.length > 0) return finalizeLoad();
            } catch(e) { console.log("M3U Failed"); }

            channelsGrid.innerHTML = `<div class="status-msg" style="color:#ff4d4d;">Channels Load Nahi Ho Paye. Stream offline ho sakti hai.</div>`;
        }

        function parseM3U(m3u) {
            const lines = m3u.split('\n');
            const channels = [];
            let current = {};

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const nameParts = line.split(',');
                    current.name = nameParts[1] ? nameParts[1].trim() : 'Channel';
                } else if (line.startsWith('#KODIPROP:inputstream.adaptive.license_key=')) {
                    const keyData = line.split('=')[1];
                    if (keyData.includes(':')) {
                        const [kId, kVal] = keyData.split(':');
                        current.key_id = kId;
                        current.key = kVal;
                    }
                } else if (line.startsWith('http')) {
                    current.stream_url = line;
                    channels.push(current);
                    current = {};
                }
            }
            return channels;
        }

        function finalizeLoad() {
            renderChannels(allChannels);
            if (allChannels.length > 0) {
                playChannel(allChannels[0], document.querySelector('.channel-card'));
            }
        }

        function renderChannels(channels) {
            channelsGrid.innerHTML = '';
            channels.forEach((ch, idx) => {
                const card = document.createElement('div');
                card.className = `channel-card ${idx === 0 ? 'active' : ''}`;
                card.innerHTML = `<i class="fa-solid fa-tv"></i> ${ch.name || 'Channel ' + (idx + 1)}`;
                card.onclick = () => playChannel(ch, card);
                channelsGrid.appendChild(card);
            });
        }

        async function playChannel(channel, cardElement) {
            currentChannel = channel;
            channelNameLabel.innerText = channel.name || "Live Stream";

            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            if (cardElement) cardElement.classList.add('active');

            const streamUrl = channel.stream_url || channel.iframe || channel.url || channel.iframeSrc;

            if (streamUrl && (streamUrl.includes('player') || streamUrl.includes('embed') || streamUrl.includes('pages.dev'))) {
                videoPlayer.style.display = 'none';
                iframePlayer.style.display = 'block';
                if(shakaPlayer) await shakaPlayer.unload();
                iframePlayer.src = streamUrl;
                return;
            }

            iframePlayer.style.display = 'none';
            iframePlayer.src = '';
            videoPlayer.style.display = 'block';

            try {
                await shakaPlayer.unload();
                if (channel.key_id && channel.key) {
                    const clearKeys = {};
                    clearKeys[channel.key_id] = channel.key;
                    shakaPlayer.configure({ drm: { clearKeys: clearKeys } });
                } else {
                    shakaPlayer.configure({ drm: { clearKeys: {} } });
                }
                await shakaPlayer.load(streamUrl);
                videoPlayer.play();
            } catch (e) {
                console.error("Playback error:", e);
            }
        }

        function reloadCurrentStream() {
            if (currentChannel) {
                playChannel(currentChannel, document.querySelector('.channel-card.active'));
            }
        }

        function filterChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allChannels.filter(c => (c.name || '').toLowerCase().includes(query));
            renderChannels(filtered);
        }

        document.addEventListener('DOMContentLoaded', () => {
            initShaka();
            loadData();
        });
    </script>
</body>
</html>
